appId: com.flighterz.business
productName: Flighterz Business
copyright: © Middle East Marina Company

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - electron/**
  - package.json

win:
  target:
    - nsis
  # Flighterz F app icon (electron-builder converts this 1254px PNG to a
  # multi-res .ico for the exe, taskbar and installer).
  icon: build/icon.png

# Install-wizard behaviour (the common Windows way).
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Flighterz Business

# Auto-update via GitHub Releases. The app checks this repo's Releases on launch
# and updates itself. Use a PUBLIC repo so clients can download without a token.
# Publish a release with:  GH_TOKEN=<token> npm run dist -- --publish always
# (or upload latest.yml + the .exe + .exe.blockmap to a Release manually).
publish:
  - provider: github
    owner: sharpyassir
    repo: flighterz-business
    releaseType: release
